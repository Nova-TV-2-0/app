<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nova TV — Streaming Premium</title>
<meta name="theme-color" content="#0a0a0f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23e50914'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white'>▶</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
:root{
  --bg:#09090e; --bg2:#101018; --bg3:#181826; --card:#14141f;
  --accent:#e50914; --accent2:#ff4d4d; --gold:#ffd700;
  --text:#fff; --text2:#a0a0b0; --text3:#555;
  --radius:14px; --tr:all .25s cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;overflow-x:hidden;min-height:100vh}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:3px}
::selection{background:var(--accent);color:#fff}

/* ═══ NAVBAR ═══ */
.navbar{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;gap:12px;padding:10px 20px;background:linear-gradient(180deg,rgba(9,9,14,.98),rgba(9,9,14,.85));backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.05);transition:var(--tr)}
.navbar.scrolled{background:rgba(9,9,14,.98);box-shadow:0 4px 30px rgba(0,0,0,.5)}
.logo{font-size:1.4rem;font-weight:900;letter-spacing:-.5px;background:linear-gradient(135deg,var(--accent),#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer;white-space:nowrap;user-select:none}
.logo span{-webkit-text-fill-color:var(--text);font-weight:300}
.nav-links{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-btn{padding:6px 14px;border:none;background:transparent;color:var(--text2);font-size:.82rem;font-weight:600;cursor:pointer;border-radius:20px;white-space:nowrap;transition:var(--tr);font-family:inherit}
.nav-btn:hover,.nav-btn.active{color:#fff;background:rgba(229,9,20,.2)}
.search-box{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:6px 14px;min-width:180px;transition:var(--tr)}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(229,9,20,.12)}
.search-box input{background:transparent;border:none;outline:none;color:#fff;font-size:.88rem;width:100%;font-family:inherit}
.search-box input::placeholder{color:var(--text3)}
.fav-nav-btn{position:relative;padding:6px 12px;border:none;background:transparent;color:var(--text2);cursor:pointer;font-size:1.1rem;border-radius:8px;transition:var(--tr)}
.fav-nav-btn:hover{color:var(--accent);background:rgba(229,9,20,.1)}
.fav-badge{position:absolute;top:0;right:0;background:var(--accent);color:#fff;font-size:.58rem;font-weight:700;min-width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center}

/* ═══ HERO ═══ */
.hero{position:relative;height:65vh;min-height:420px;display:flex;align-items:flex-end;overflow:hidden}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity 1s}
.hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,9,14,.2),rgba(9,9,14,.55) 50%,var(--bg))}
.hero-content{position:relative;z-index:2;padding:0 40px 40px;max-width:650px}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;padding:4px 12px;border-radius:4px;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:14px}
.hero-title{font-size:clamp(1.8rem,4.5vw,3.2rem);font-weight:900;line-height:1.1;margin-bottom:10px;text-shadow:0 4px 20px rgba(0,0,0,.8)}
.hero-meta{display:flex;gap:14px;margin-bottom:10px;font-size:.88rem;color:var(--text2)}
.hero-meta .rating{color:var(--gold);font-weight:700}
.hero-desc{font-size:.95rem;line-height:1.6;color:var(--text2);margin-bottom:20px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 26px;border:none;border-radius:6px;font-size:.95rem;font-weight:700;cursor:pointer;transition:var(--tr);font-family:inherit}
.btn-primary{background:#fff;color:#000}
.btn-primary:hover{background:rgba(255,255,255,.85);transform:scale(1.04)}
.btn-secondary{background:rgba(109,109,110,.7);color:#fff;backdrop-filter:blur(10px)}
.btn-secondary:hover{background:rgba(109,109,110,.5)}
.hero-dots{position:absolute;bottom:18px;right:40px;display:flex;gap:8px;z-index:2}
.hero-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;transition:var(--tr);border:none;padding:0}
.hero-dot.active{background:var(--accent);width:24px;border-radius:4px}

/* ═══ SECCIONES ═══ */
.section{padding:20px 0 6px}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:0 40px;margin-bottom:14px}
.section-title{font-size:1.25rem;font-weight:800;display:flex;align-items:center;gap:10px}
.section-title .icon{font-size:1.4rem}
.section-count{background:var(--bg3);padding:2px 10px;border-radius:12px;font-size:.72rem;color:var(--text2);font-weight:600}
.row-wrap{position:relative}
.row{display:flex;gap:12px;overflow-x:auto;padding:6px 40px 18px;scroll-behavior:smooth;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row-arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:none;background:rgba(9,9,14,.85);color:#fff;font-size:1.1rem;cursor:pointer;z-index:10;transition:var(--tr);display:flex;align-items:center;justify-content:center;opacity:0;backdrop-filter:blur(10px)}
.row-wrap:hover .row-arrow{opacity:1}
.row-arrow:hover{background:var(--accent)}
.row-arrow.left{left:6px}
.row-arrow.right{right:6px}

/* ═══ TARJETAS ═══ */
.card{flex:0 0 185px;background:var(--card);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:var(--tr);position:relative;border:1px solid rgba(255,255,255,.04)}
.card:hover{transform:translateY(-6px);box-shadow:0 12px 40px rgba(0,0,0,.7);border-color:rgba(229,9,20,.25);z-index:5}
.card:focus{outline:3px solid var(--accent);outline-offset:2px}
.card-img{width:100%;height:110px;object-fit:cover;display:block;background:var(--bg3)}
.card-img.placeholder{display:flex;align-items:center;justify-content:center;font-size:2.2rem;background:linear-gradient(135deg,var(--bg3),var(--bg2))}
.card-body{padding:10px 12px}
.card-title{font-size:.82rem;font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{font-size:.7rem;color:var(--text3);display:flex;gap:6px;align-items:center}
.card-badge{position:absolute;top:8px;left:8px;padding:2px 8px;border-radius:4px;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;z-index:2}
.badge-live{background:var(--accent);color:#fff;animation:pulse 2s infinite}
.badge-vod{background:rgba(0,0,0,.75);color:var(--gold);backdrop-filter:blur(5px)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.card-fav{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:none;background:rgba(0,0,0,.65);color:#fff;font-size:.85rem;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;opacity:0;transition:var(--tr);backdrop-filter:blur(5px)}
.card:hover .card-fav{opacity:1}
.card-fav.active{opacity:1;background:var(--accent)}
.card-fav:hover{transform:scale(1.15)}

/* ═══ REPRODUCTOR ═══ */
.player-overlay{position:fixed;inset:0;z-index:2000;background:#000;display:none;flex-direction:column}
.player-overlay.active{display:flex}
.player-container{position:relative;flex:1;display:flex;align-items:center;justify-content:center;background:#000}
.player-container video{width:100%;height:100%;object-fit:contain}
.player-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.75);z-index:10}
.spinner{width:48px;height:48px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.player-error{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,.92);z-index:10;text-align:center;padding:24px}
.player-error.active{display:flex}
.player-error-icon{font-size:3.5rem}
.player-error-text{font-size:1rem;color:var(--text2);max-width:380px}
.player-topbar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px 20px;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);transition:var(--tr)}
.player-title{font-size:1.05rem;font-weight:700;flex:1;text-shadow:0 2px 8px rgba(0,0,0,.8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player-back{width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--tr);backdrop-filter:blur(10px);flex-shrink:0}
.player-back:hover{background:var(--accent)}
.player-controls{position:absolute;bottom:0;left:0;right:0;z-index:20;padding:14px 20px 18px;background:linear-gradient(0deg,rgba(0,0,0,.92),transparent);transition:var(--tr)}
.player-overlay.hide-ui .player-topbar,.player-overlay.hide-ui .player-controls{opacity:0;pointer-events:none}
.progress-bar{width:100%;height:4px;background:rgba(255,255,255,.2);border-radius:2px;cursor:pointer;position:relative;margin-bottom:10px;transition:height .2s}
.progress-bar:hover{height:7px}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;position:relative;transition:width .1s linear}
.progress-fill::after{content:'';position:absolute;right:-5px;top:50%;transform:translateY(-50%);width:10px;height:10px;background:var(--accent);border-radius:50%;opacity:0;transition:opacity .2s}
.progress-bar:hover .progress-fill::after{opacity:1}
.progress-time{display:flex;justify-content:space-between;font-size:.72rem;color:var(--text2);margin-bottom:6px;font-variant-numeric:tabular-nums}
.controls-row{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.controls-row::-webkit-scrollbar{display:none}
.ctrl-btn{width:38px;height:38px;border-radius:8px;border:none;background:transparent;color:#fff;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--tr);position:relative;flex-shrink:0}
.ctrl-btn:hover{background:rgba(255,255,255,.15)}
.ctrl-btn.main{width:48px;height:48px;background:#fff;color:#000;border-radius:50%}
.ctrl-btn.main:hover{background:var(--accent);color:#fff}
.ctrl-btn.active{background:var(--accent)}
.ctrl-sep{width:1px;height:22px;background:rgba(255,255,255,.15);margin:0 4px;flex-shrink:0}
.ctrl-label{font-size:.7rem;color:var(--text2);padding:3px 8px;background:rgba(255,255,255,.1);border-radius:4px;cursor:pointer;border:none;font-family:inherit;transition:var(--tr);white-space:nowrap;flex-shrink:0}
.ctrl-label:hover{background:rgba(255,255,255,.2);color:#fff}
.volume-group{display:flex;align-items:center;gap:6px;flex-shrink:0}
.volume-slider-wrap{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.08);border-radius:18px;padding:3px 10px}
.volume-icon{font-size:.95rem;cursor:pointer;user-select:none}
input[type=range].volume-slider{-webkit-appearance:none;width:80px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;outline:none;cursor:pointer}
input[type=range].volume-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);cursor:pointer}
.volume-pct{font-size:.68rem;color:var(--gold);font-weight:700;min-width:34px;text-align:right}
.ctrl-menu{position:absolute;bottom:50px;right:0;background:rgba(18,18,28,.97);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:6px;min-width:170px;backdrop-filter:blur(20px);display:none;z-index:30;box-shadow:0 8px 32px rgba(0,0,0,.6)}
.ctrl-menu.open{display:block;animation:menuIn .18s ease}
@keyframes menuIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.ctrl-menu-title{font-size:.65rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;padding:5px 10px 3px}
.menu-item{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border:none;background:transparent;color:var(--text2);font-size:.8rem;cursor:pointer;border-radius:6px;transition:var(--tr);font-family:inherit;text-align:left}
.menu-item:hover{background:rgba(255,255,255,.07);color:#fff}
.menu-item.active{color:var(--accent);font-weight:700}
.menu-item .check{margin-left:auto;font-size:.65rem}

/* ═══ MODAL ═══ */
.modal-overlay{position:fixed;inset:0;z-index:1500;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;backdrop-filter:blur(8px);padding:20px}
.modal-overlay.active{display:flex}
.modal{background:var(--bg2);border-radius:16px;max-width:540px;width:100%;max-height:85vh;overflow-y:auto;position:relative;border:1px solid rgba(255,255,255,.07);animation:modalIn .25s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.modal-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:none;background:rgba(0,0,0,.65);color:#fff;font-size:.95rem;cursor:pointer;z-index:2;transition:var(--tr)}
.modal-close:hover{background:var(--accent);transform:rotate(90deg)}
.modal-banner{width:100%;height:200px;object-fit:cover;border-radius:16px 16px 0 0}
.modal-banner.placeholder{display:flex;align-items:center;justify-content:center;font-size:3.5rem;background:linear-gradient(135deg,var(--bg3),var(--bg2))}
.modal-body{padding:22px}
.modal-title{font-size:1.4rem;font-weight:900;margin-bottom:8px}
.modal-meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;font-size:.82rem;color:var(--text2)}
.modal-desc{font-size:.92rem;line-height:1.65;color:var(--text2);margin-bottom:18px}
.modal-url{font-size:.68rem;color:var(--text3);word-break:break-all;background:var(--bg3);padding:8px 12px;border-radius:6px;margin-bottom:14px;font-family:monospace}

/* ═══ BÚSQUEDA / FAVORITOS ═══ */
.search-results{padding:90px 40px 40px;min-height:100vh}
.search-results.hidden,.favorites-page.hidden{display:none}
.search-header{margin-bottom:20px}
.search-header h2{font-size:1.4rem;font-weight:800}
.search-header p{color:var(--text2);font-size:.88rem;margin-top:4px}
.no-results{text-align:center;padding:70px 24px;color:var(--text3)}
.no-results-icon{font-size:3.5rem;margin-bottom:14px}
.favorites-page{padding:90px 40px 40px;min-height:100vh}
.fav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px;margin-top:18px}

/* ═══ LOADING ═══ */
.app-loading{position:fixed;inset:0;z-index:3000;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .4s}
.app-loading.hidden{opacity:0;pointer-events:none}
.app-loading-logo{font-size:2.8rem;font-weight:900;background:linear-gradient(135deg,var(--accent),#ff6b6b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:pulse 2s infinite}
.app-loading-bar{width:180px;height:3px;background:var(--bg3);border-radius:2px;overflow:hidden}
.app-loading-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s;width:0%}
.app-loading-text{font-size:.82rem;color:var(--text3)}

/* ═══ TOAST ═══ */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(18,18,28,.97);border:1px solid rgba(255,255,255,.08);color:#fff;padding:11px 22px;border-radius:12px;font-size:.88rem;z-index:4000;transition:transform .3s;backdrop-filter:blur(20px);display:flex;align-items:center;gap:8px;box-shadow:0 8px 32px rgba(0,0,0,.6);max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ═══ FOOTER ═══ */
.footer{padding:36px 40px;margin-top:36px;border-top:1px solid rgba(255,255,255,.05);text-align:center;color:var(--text3);font-size:.8rem}
.footer a{color:var(--text2);text-decoration:none;margin:0 8px}
.footer a:hover{color:var(--accent)}

/* ═══ RESPONSIVE ═══ */
@media(max-width:1024px){
  .section-header,.row{padding-left:24px;padding-right:24px}
  .hero-content{padding:0 24px 36px}
  .hero-dots{right:24px}
  .search-results,.favorites-page{padding-left:24px;padding-right:24px}
}
@media(max-width:768px){
  .navbar{flex-wrap:wrap;gap:6px;padding:8px 14px}
  .logo{font-size:1.15rem}
  .search-box{order:3;width:100%;min-width:unset}
  .hero{height:55vh;min-height:360px}
  .hero-content{padding:0 16px 28px}
  .hero-title{font-size:1.5rem}
  .section-header,.row{padding-left:14px;padding-right:14px}
  .card{flex:0 0 150px}
  .card-img{height:85px}
  .row-arrow{display:none}
  .search-results,.favorites-page{padding-left:14px;padding-right:14px}
  .fav-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .ctrl-btn{width:34px;height:34px;font-size:.9rem}
  .ctrl-btn.main{width:42px;height:42px}
  input[type=range].volume-slider{width:60px}
  .volume-pct{display:none}
  .player-title{font-size:.85rem}
  .footer{padding:28px 14px}
}
@media(max-width:480px){
  .card{flex:0 0 125px}
  .card-img{height:70px}
  .card-body{padding:7px 9px}
  .card-title{font-size:.72rem}
  .hero-actions .btn{padding:9px 18px;font-size:.88rem}
}

/* ═══ LANDSCAPE FORZADO EN MÓVIL ═══ */
@media(max-width:768px) and (orientation:landscape){
  .navbar{display:none}
}
</style>
</head>
<body>

<div class="app-loading" id="appLoading">
  <div class="app-loading-logo">▶ Nova TV</div>
  <div class="app-loading-bar"><div class="app-loading-fill" id="loadingFill"></div></div>
  <div class="app-loading-text" id="loadingText">Iniciando...</div>
</div>

<nav class="navbar" id="navbar">
  <div class="logo" onclick="showHome()">▶ Nova<span>TV</span></div>
  <div class="nav-links" id="navLinks"></div>
  <div class="search-box">
    <span>⌕</span>
    <input type="text" id="searchInput" placeholder="Buscar canales, películas..." autocomplete="off">
  </div>
  <button class="fav-nav-btn" onclick="showFavorites()" title="Favoritos">♥<span class="fav-badge" id="favBadge">0</span></button>
</nav>

<div class="hero" id="hero">
  <div class="hero-bg" id="heroBg"></div>
  <div class="hero-content">
    <div class="hero-badge" id="heroBadge">● EN VIVO</div>
    <h1 class="hero-title" id="heroTitle"></h1>
    <div class="hero-meta" id="heroMeta"></div>
    <p class="hero-desc" id="heroDesc"></p>
    <div class="hero-actions">
      <button class="btn btn-primary" id="heroPlayBtn">▶ Reproducir</button>
      <button class="btn btn-secondary" id="heroInfoBtn">ℹ Más Info</button>
    </div>
  </div>
  <div class="hero-dots" id="heroDots"></div>
</div>

<main id="mainContent"></main>

<div class="search-results hidden" id="searchResults">
  <div class="search-header">
    <h2 id="searchTitle">Resultados</h2>
    <p id="searchCount"></p>
  </div>
  <div class="row" id="searchRow" style="padding:0;flex-wrap:wrap"></div>
</div>

<div class="favorites-page hidden" id="favoritesPage">
  <h2 style="font-size:1.4rem;font-weight:800">♥ Mis Favoritos</h2>
  <p style="color:var(--text2);font-size:.88rem;margin-top:4px" id="favCount"></p>
  <div class="fav-grid" id="favGrid"></div>
</div>

<div class="player-overlay" id="playerOverlay">
  <div class="player-container" id="playerContainer">
    <video id="videoPlayer" playsinline webkit-playsinline></video>
    <div class="player-loading" id="playerLoading">
      <div class="spinner"></div>
      <div style="color:var(--text2);font-size:.88rem">Cargando stream...</div>
    </div>
    <div class="player-error" id="playerError">
      <div class="player-error-icon">📡</div>
      <div class="player-error-text" id="playerErrorText">Error al cargar el stream.</div>
      <button class="btn btn-primary" onclick="closePlayer()">← Volver</button>

// ─── Parser M3U ───
function parseM3U(content, source) {
  const items = [];
  const lines = content.split('\n');
  let meta = {};
  for (let raw of lines) {
    const line = raw.trim();
    if (line.startsWith('#EXTINF:')) {
      meta = { section: source.section, source: source.name, emoji: source.emoji };
      const attrs = line.match(/([a-zA-Z-]+)="([^"]*)"/g);
      if (attrs) attrs.forEach(a => { const idx = a.indexOf('='); meta[a.slice(0,idx).replace(/"/g,'')] = a.slice(idx+1).replace(/"/g,''); });
      const ci = line.lastIndexOf(',');
      if (ci !== -1) meta.title = line.substring(ci + 1).trim();
      meta.logo = meta.logo || meta.tvgLogo || '';
      meta.group = meta.groupTitle || 'General';
    } else if (line && !line.startsWith('#')) {
      if (meta.title && !isAdUrl(line)) {
        const family = categorizeItem(meta.title);
        items.push({
          id: 'src_' + source.name.replace(/\W/g,'') + '_' + items.length,
          title: meta.title,
          url: line,
          logo: meta.logo || '',
          group: meta.group || 'General',
          section: family ? `Familia ${family}` : (meta.section || source.section),
          family: family,
          source: meta.source,
          emoji: meta.emoji || '📺',
          type: 'live',
          desc: `Canal de televisión en vivo. Fuente: ${meta.source}.`,
        });
      }
      meta = {};
    }
  }
  return items;
}

// ─── TMDB (imágenes de películas/series) ───
const TMDB_API_KEY = '2ccddba3df14826050e3583ca17e374a'; // Demo key - replace with yours

async function fetchTMDBImage(title, year, type) {
  const cacheKey = title + '_' + (year || '');
  if (state.tmdbCache.has(cacheKey)) return state.tmdbCache.get(cacheKey);
  
  try {
    const searchType = type === 'movie' ? 'movie' : 'tv';
    const url = `https://api.themoviedb.org/3/search/${searchType}?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(title)}&year=${year || ''}&language=es-ES`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('TMDB error');
    const data = await res.json();
    if (data.results && data.results.length > 0) {
      const item = data.results[0];
      const img = item.backdrop_path 
        ? `https://image.tmdb.org/t/p/w500${item.backdrop_path}`
        : (item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : null);
      state.tmdbCache.set(cacheKey, img);
      return img;
    }
  } catch (e) {}
  state.tmdbCache.set(cacheKey, null);
  return null;
}

// ─── Carga de Fuentes ───
async function fetchWithFallback(url) {
  for (const proxy of CORS_PROXIES) {
    try {
      const res = await fetch(proxy(url));
      if (res.ok) return await res.text();
    } catch (e) {}
  }
  throw new Error('Fail: ' + url);
}

async function loadAllSources() {
  const total = SOURCES.length + 1;
  let done = 0;
  const allItems = [];

  // VOD primero (rápido)
  VOD_CONTENT.forEach((v, i) => {
    allItems.push({ ...v, id: 'vod_' + i, type: 'vod' });
  });
  setLoading(10, 'Cargando catálogo...');

  // Enriquecer VOD con imágenes TMDB en background
  VOD_CONTENT.forEach(async (v, i) => {
    const img = await fetchTMDBImage(v.title, v.year, v.type);
    if (img) {
      const item = allItems.find(x => x.id === 'vod_' + i);
      if (item) { item.logo = img; updateCardImage(item.id, img); }
    }
  });

  // Cargar M3U en paralelo
  const promises = SOURCES.map(async (src) => {
    try {
      const text = await fetchWithFallback(src.url);
      const parsed = parseM3U(text, src);
      allItems.push(...parsed);
    } catch (e) { console.warn('Error:', src.name); }
    done++;
    setLoading(10 + (done / total) * 80, `Cargando ${src.name}...`);
  });

  await Promise.all(promises);
  state.allContent = allItems;
  
  // Cargar YouTube en background (no bloquea)
  loadYouTubeFeeds();
  
  setLoading(100, '¡Listo!');
  setTimeout(() => $('appLoading').classList.add('hidden'), 400);
}

// ─── YouTube (Invidious API) ───
async function loadYouTubeFeeds() {
  for (const feed of YOUTUBE_FEEDS) {
    try {
      const res = await fetch(`${feed.url}&region=US&hl=es`);
      if (!res.ok) continue;
      const text = await res.text();
      const items = parseYouTubeRSS(text, feed);
      if (items.length) {
        state.allContent.push(...items);
        renderRow(feed.section, items);
      }
    } catch (e) { console.warn('YT feed error:', feed.name); }
  }
}

function parseYouTubeRSS(xmlText, feed) {
  const items = [];
  try {
    const parser = new DOMParser();
    const doc = parser.parseFromString(xmlText, 'text/xml');
    const entries = doc.querySelectorAll('entry');
    entries.forEach((entry, i) => {
      const title = entry.querySelector('title')?.textContent || 'Sin título';
      const videoId = entry.querySelector('yt\\:videoId, videoId')?.textContent;
      const thumb = entry.querySelector('media\\:thumbnail, thumbnail')?.getAttribute('url');
      const desc = entry.querySelector('media\\:description, description')?.textContent?.substring(0, 200) || '';
      if (videoId && !isAdUrl(title)) {
        items.push({
          id: 'yt_' + videoId,
          title: title,
          url: `https://www.youtube.com/watch?v=${videoId}`,
          logo: thumb || '',
          group: feed.name,
          section: feed.section,
          family: 'YouTube',
          source: 'YouTube',
          emoji: feed.icon,
          type: 'youtube',
          desc: desc,
        });
      }
    });
  } catch (e) {}
  return items;
}

// ─── Actualizar imagen de tarjeta en vivo ───
function updateCardImage(id, imgUrl) {
  const card = document.querySelector(`.card[data-id="${id}"] .card-img`);
  if (card && card.tagName === 'IMG') {
    card.src = imgUrl;
  } else if (card) {
    const img = document.createElement('img');
    img.className = 'card-img';
    img.src = imgUrl;
    img.loading = 'lazy';
    card.replaceWith(img);
  }
}

    </div>`;
}

function renderRow(sectionName, items) {
  if (!items.length) return '';
  const emoji = items[0]?.emoji || '📂';
  const secId = 'sec_' + sectionName.replace(/\W/g, '');
  // Evitar duplicar sección
  if (document.getElementById(secId)) {
    const row = document.querySelector(`#${secId} .row`);
    if (row) row.insertAdjacentHTML('beforeend', items.map(cardHTML).join(''));
    const count = document.querySelector(`#${secId} .section-count`);
    if (count) count.textContent = parseInt(count.textContent) + items.length;
    return '';
  }
  return `
    <div class="section" id="${secId}">
      <div class="section-header">
        <div class="section-title"><span class="icon">${emoji}</span> ${esc(sectionName)}</div>
        <span class="section-count">${items.length}</span>
      </div>
      <div class="row-wrap">
        <button class="row-arrow left" onclick="this.parentElement.querySelector('.row').scrollBy({left:-400,behavior:'smooth'})">‹</button>
        <div class="row">${items.map(cardHTML).join('')}</div>
        <button class="row-arrow right" onclick="this.parentElement.querySelector('.row').scrollBy({left:400,behavior:'smooth'})">›</button>
      </div>
    </div>`;
}

function getSections() {
  const sections = {};
  state.allContent.forEach(item => {
    const sec = item.section || 'Otros';
    if (!sections[sec]) sections[sec] = [];
    sections[sec].push(item);
  });
  return sections;
}

function renderHome() {
  const sections = getSections();
  const priority = [
    'Familia Disney', 'Familia HBO', 'Familia Warner', 'Familia Paramount', 'Familia Universal',
    'Familia Fox', 'Familia Discovery', 'Familia ESPN / Deportes', 'Familia Noticias',
    'YouTube Tendencias', 'YouTube Música', 'YouTube Gaming',
    'Televisión en Vivo', 'Canales de Venezuela', 'Canales en Español',
    'Películas', 'Series y Anime', 'Canales FAST', 'Documentales'
  ];
  const sorted = Object.entries(sections).sort((a, b) => {
    const ia = priority.indexOf(a[0]); const ib = priority.indexOf(b[0]);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });
  $('mainContent').innerHTML = sorted.map(([name, items]) => renderRow(name, items)).join('');
  renderNav();
}

function renderNav() {
  const sections = getSections();
  const names = Object.keys(sections);
  $('navLinks').innerHTML = names.map(n =>
    `<button class="nav-btn" onclick="scrollToSection('${n.replace(/\W/g,'')}')">${esc(n.replace('Familia ', '').replace('YouTube ', 'YT '))}</button>`
  ).join('');
}

function scrollToSection(id) {
  showHome();
  setTimeout(() => {
    const el = $('sec_' + id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 60);
}

const video = $('videoPlayer');

function openPlayerById(id) {

}

async function openPlayer(item) {
  state.currentPlaying = item;
  $('playerTitle').textContent = item.title;
  $('playerOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
  $('playerError').classList.remove('active');

  $('qualityLabel').style.display = 'none';

  // Rotación forzada en móvil
  await forceLandscape();

  initAudioGraph();

  if (item.type === 'youtube') {
    await loadYouTubeStream(item.url);
  } else {
    loadStream(item.url);
  }
  scheduleHideUI();
}

function closePlayer() {
  if (state.hls) { state.hls.destroy(); state.hls = null; }
  video.pause();
  video.removeAttribute('src');
  video.load();
  $('playerOverlay').classList.remove('active');
  document.body.style.overflow = '';
  state.currentPlaying = null;
  if (document.fullscreenElement) document.exitFullscreen();
  // Volver a portrait si estamos en móvil
  if (screen.orientation && screen.orientation.unlock) {
    screen.orientation.unlock();
  }
  hideMenus();
}

// ─── Rotación forzada ───
async function forceLandscape() {
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if (!isMobile) return;
  try {
    // Intentar bloquear a landscape
    if (screen.orientation && screen.orientation.lock) {
      await screen.orientation.lock('landscape');
    }
  } catch (e) {
    // Fallback: fullscreen primero, luego lock
    try {
      await $('playerContainer').requestFullscreen();
      if (screen.orientation && screen.orientation.lock) {
        await screen.orientation.lock('landscape');
      }
    } catch (e2) {}
  }
}

// ─── YouTube sin anuncios (Invidious) ───
async function loadYouTubeStream(ytUrl) {
  const videoId = ytUrl.match(/v=([^&]+)/)?.[1];
  if (!videoId) { showPlayerError('Video no válido'); return; }

  // Intentar instancias de Invidious
  for (const instance of INVIDIOUS_INSTANCES) {
    try {
      const res = await fetch(`${instance}/api/v1/videos/${videoId}?hl=es`);
      if (!res.ok) continue;
      const data = await res.json();
      
      // Filtrar formatos de video (no HLS para simplicidad, usar MP4 directo)
      const formats = data.formatStreams || data.adaptiveFormats || [];
      const best = formats
        .filter(f => f.container === 'mp4' && f.qualityLabel)
        .sort((a, b) => parseInt(b.qualityLabel) - parseInt(a.qualityLabel))[0];
      
      if (best && best.url && !isAdUrl(best.url)) {
        video.src = best.url;
        video.addEventListener('loadedmetadata', () => {
          $('playerLoading').style.display = 'none';
          video.play().catch(() => {});
        }, { once: true });
        video.addEventListener('error', () => showPlayerError('Error al cargar video de YouTube.'), { once: true });
        return;
      }
    } catch (e) { continue; }
  }
  
  // Fallback: embed con bloqueador
  loadYouTubeFallback(videoId);
}

function loadYouTubeFallback(videoId) {
  // Usar Piped como fallback
  const pipedInstances = ['https://pipedapi.kavin.rocks', 'https://api.piped.private.coffee'];
  
  (async () => {
    for (const api of pipedInstances) {
      try {
        const res = await fetch(`${api}/streams/${videoId}`);
        if (!res.ok) continue;
        const data = await res.json();
        const stream = data.videoStreams?.find(s => s.mimeType === 'video/mp4' && !isAdUrl(s.url));
        if (stream) {
          video.src = stream.url;
          video.addEventListener('loadedmetadata', () => {
            $('playerLoading').style.display = 'none';
            video.play().catch(() => {});
          }, { once: true });
          return;
        }
      } catch (e) { continue; }
    }
    showPlayerError('No se pudo cargar el video de YouTube. Intenta más tarde.');
  })();
}

// ─── Cargar stream HLS/MP4 ───
function loadStream(url) {
  if (state.hls) { state.hls.destroy(); state.hls = null; }

  const isHLS = url.includes('.m3u8');
  const isMP4 = url.match(/\.(mp4|webm|ogg|mov)(\?|$)/i);

  if (isHLS && Hls.isSupported()) {
    state.hls = new Hls({
      maxBufferLength: 20,
      maxMaxBufferLength: 40,
      liveSyncDurationCount: 3,
      enableWorker: true,
      lowLatencyMode: true,
      backBufferLength: 20,
      startLevel: -1,
      // Bloquear segmentos de anuncios
      xhrSetup: (xhr, reqUrl) => {
        if (isAdUrl(reqUrl)) {
          xhr.abort();
          console.log('Ad blocked:', reqUrl);
        }
      },
      // Filtro de playlists
      pLoader: function(config) {
        const loader = new Hls.DefaultConfig.pLoader(config);
        const load = loader.load.bind(loader);
        loader.load = function(context, config, callbacks) {
          if (isAdUrl(context.url)) {
            callbacks.onError({ code: 400, text: 'Ad blocked' }, context, null);
            return;
          }
          load(context, config, callbacks);
        };
        return loader;
      },
    });

    state.hls.loadSource(url);
    state.hls.attachMedia(video);

    state.hls.on(Hls.Events.MANIFEST_PARSED, (_, data) => {
      $('playerLoading').style.display = 'none';
      buildQualityMenu(data.levels);
      video.play().catch(() => {});
    });

    state.hls.on(Hls.Events.LEVEL_SWITCHED, (_, data) => {
      const lvl = state.hls.levels[data.level];
      if (lvl) $('qualityLabel').textContent = lvl.height + 'p';
    });

    state.hls.on(Hls.Events.AUDIO_TRACKS_UPDATED, (_, data) => {
      buildAudioMenu(data.audioTracks || []);
    });

    state.hls.on(Hls.Events.SUBTITLE_TRACKS_UPDATED, (_, data) => {
      buildSubsMenu(data.subtitleTracks || []);
    });

    state.hls.on(Hls.Events.ERROR, (_, data) => {
      if (data.fatal) {
        if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
          state.hls.recoverMediaError();
        } else {
          showPlayerError('Stream no disponible o fuera de línea.');
        }
      }
    });

  } else if (isHLS && video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = url;
    video.addEventListener('loadedmetadata', () => {
      $('playerLoading').style.display = 'none';
      video.play().catch(() => {});
    }, { once: true });
    video.addEventListener('error', () => showPlayerError('Error al cargar.'), { once: true });

  } else {
    video.src = url;
    video.addEventListener('loadedmetadata', () => {
      $('playerLoading').style.display = 'none';
      video.play().catch(() => {});
    }, { once: true });
    video.addEventListener('error', () => showPlayerError('Error al cargar video.'), { once: true });
  }

  // Pistas nativas
  video.addEventListener('loadedmetadata', () => {
    if (video.audioTracks && video.audioTracks.length > 1) buildAudioMenuNative(video.audioTracks);
    if (video.textTracks && video.textTracks.length > 0) buildSubsMenuNative(video.textTracks);
  }, { once: true });
}

function showPlayerError(msg) {
  $('playerLoading').style.display = 'none';
  $('playerErrorText').textContent = msg;
  $('playerError').classList.add('active');
}

/* ═══════════════════════════════════════════════════════════
   AUDIO (Amplificación 300%)
   ═══════════════════════════════════════════════════════════ */

function initAudioGraph() {
  if (state.audioCtx) return;
  try {
    state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = state.audioCtx.createMediaElementSource(video);
    state.gainNode = state.audioCtx.createGain();
    const comp = state.audioCtx.createDynamicsCompressor();
    comp.threshold.value = -12;
    comp.ratio.value = 12;
    src.connect(state.gainNode);
    state.gainNode.connect(comp);
    comp.connect(state.audioCtx.destination);
  } catch (e) {}
}

function setVolume(pct) {
  const val = Math.min(300, Math.max(0, pct));
  $('volumeSlider').value = val;
  $('volumePct').textContent = val + '%';
  if (state.gainNode) state.gainNode.gain.value = val / 100;
  else video.volume = Math.min(1, val / 100);
  $('volumeIcon').textContent = val === 0 ? '🔇' : val < 50 ? '🔉' : '🔊';
  $('muteBtn').textContent = val === 0 ? '🔇' : '🔊';
}

/* ═══════════════════════════════════════════════════════════
   MENÚS
   ═══════════════════════════════════════════════════════════ */

function hideMenus() {
  document.querySelectorAll('.ctrl-menu').forEach(m => m.classList.remove('open'));
  state.activeMenu = null;
}

function toggleMenu(id) {
  const m = $(id);
  const was = m.classList.contains('open');
  hideMenus();
  if (!was) { m.classList.add('open'); state.activeMenu = id; }
}

function buildQualityMenu(levels) {
  if (!levels || levels.length <= 1) return;
  $('qualityLabel').style.display = '';
  $('qualityMenu').innerHTML = '<div class="ctrl-menu-title">Calidad</div>' +
    `<button class="menu-item active" data-q="-1" onclick="setQuality(-1)">⚡ Auto<span class="check">✓</span></button>` +
    levels.map((l, i) => `<button class="menu-item" data-q="${i}" onclick="setQuality(${i})">${l.height ? l.height + 'p' : 'Nivel ' + i}<span class="check"></span></button>`).join('');
}

function setQuality(idx) {
  if (state.hls) state.hls.currentLevel = idx;
  document.querySelectorAll('#qualityMenu .menu-item').forEach(b => {
    const active = parseInt(b.dataset.q) === idx;
    b.classList.toggle('active', active);
    b.querySelector('.check').textContent = active ? '✓' : '';
  });
  $('qualityLabel').textContent = idx === -1 ? 'AUTO' : state.hls.levels[idx]?.height + 'p';
  hideMenus();
}

function buildAudioMenu(tracks) {
  if (!tracks?.length) return;
  $('audioMenu').innerHTML = '<div class="ctrl-menu-title">Audio</div>' +
    tracks.map((t, i) => `<button class="menu-item ${i===0?'active':''}" onclick="setAudioTrack(${i})">${esc(t.name || t.lang || 'Audio ' + (i+1))}<span class="check">${i===0?'✓':''}</span></button>`).join('');
}

function setAudioTrack(idx) {
  if (state.hls) state.hls.audioTrack = idx;
  hideMenus();
}

function buildAudioMenuNative(tracks) {
  let html = '<div class="ctrl-menu-title">Audio</div>';
  for (let i = 0; i < tracks.length; i++) {
    html += `<button class="menu-item ${tracks[i].enabled?'active':''}" onclick="setAudioTrackNative(${i})">${esc(tracks[i].label || tracks[i].language || 'Audio ' + (i+1))}<span class="check">${tracks[i].enabled?'✓':''}</span></button>`;
  }
  $('audioMenu').innerHTML = html;
}

function setAudioTrackNative(idx) {
  if (video.audioTracks) for (let i = 0; i < video.audioTracks.length; i++) video.audioTracks[i].enabled = i === idx;
  hideMenus();
}

function buildSubsMenu(tracks) {
  if (!tracks?.length) return;
  $('subsMenu').innerHTML = '<div class="ctrl-menu-title">Subtítulos</div>' +
    `<button class="menu-item active" onclick="setSubtitle(-1)">Desactivados<span class="check">✓</span></button>` +
    tracks.map((t, i) => `<button class="menu-item" onclick="setSubtitle(${i})">${esc(t.name || t.lang || 'Sub ' + (i+1))}<span class="check"></span></button>`).join('');
}

function setSubtitle(idx) {
  if (state.hls) state.hls.subtitleTrack = idx;
  hideMenus();
}

function buildSubsMenuNative(tracks) {
  const subs = [];
  for (let i = 0; i < tracks.length; i++) if (tracks[i].kind === 'subtitles' || tracks[i].kind === 'captions') subs.push(i);
  if (!subs.length) return;
  let html = '<div class="ctrl-menu-title">Subtítulos</div>' +
    `<button class="menu-item active" onclick="setSubtitleNative(-1)">Desactivados<span class="check">✓</span></button>`;
  subs.forEach(idx => {
    html += `<button class="menu-item" onclick="setSubtitleNative(${idx})">${esc(tracks[idx].label || tracks[idx].language || 'Sub ' + idx)}<span class="check"></span></button>`;
  });
  $('subsMenu').innerHTML = html;
}

function setSubtitleNative(idx) {
  if (video.textTracks) for (let i = 0; i < video.textTracks.length; i++) video.textTracks[i].mode = i === idx ? 'showing' : 'hidden';
  hideMenus();
}

async function toggleFullscreen() {
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  
  if (!document.fullscreenElement) {
    await $('playerContainer').requestFullscreen().catch(() => {});

    }
  } else {
    document.exitFullscreen();
    if (screen.orientation?.unlock) screen.orientation.unlock();

function formatTime(s) {
  if (!isFinite(s)) return '0:00';
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
  return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` : `${m}:${String(sec).padStart(2,'0')}`;
}

function scheduleHideUI() {
  clearTimeout(state.hideUITimer);
  $('playerOverlay').classList.remove('hide-ui');
  state.hideUITimer = setTimeout(() => {
    if (!video.paused && !state.activeMenu) $('playerOverlay').classList.add('hide-ui');
  }, 3000);
}

/* ═══════════════════════════════════════════════════════════

video.addEventListener('play', () => { $('playPauseBtn').textContent = '⏸'; scheduleHideUI(); });
video.addEventListener('pause', () => { $('playPauseBtn').textContent = '▶'; clearTimeout(state.hideUITimer); $('playerOverlay').classList.remove('hide-ui'); });
video.addEventListener('timeupdate', () => {
  if (video.duration && isFinite(video.duration)) {
    $('progressFill').style.width = (video.currentTime / video.duration * 100) + '%';
    $('timeCurrent').textContent = formatTime(video.currentTime);
    $('timeDuration').textContent = formatTime(video.duration);
  }
});
video.addEventListener('click', () => { togglePlay(); scheduleHideUI(); });
video.addEventListener('dblclick', () => toggleFullscreen());
video.addEventListener('waiting', () => { $('playerLoading').style.display = 'flex'; });
video.addEventListener('playing', () => { $('playerLoading').style.display = 'none'; });

$('progressBar').addEventListener('click', e => {
  if (!video.duration || !isFinite(video.duration)) return;
  const rect = e.currentTarget.getBoundingClientRect();
  video.currentTime = ((e.clientX - rect.left) / rect.width) * video.duration;
  scheduleHideUI();
});

$('playPauseBtn').addEventListener('click', e => { e.stopPropagation(); togglePlay(); scheduleHideUI(); });
$('muteBtn').addEventListener('click', e => { e.stopPropagation(); toggleMute(); scheduleHideUI(); });
$('fullscreenBtn').addEventListener('click', e => { e.stopPropagation(); toggleFullscreen(); scheduleHideUI(); });
$('settingsBtn').addEventListener('click', e => { e.stopPropagation(); toggleMenu('qualityMenu'); });
$('audioBtn').addEventListener('click', e => { e.stopPropagation(); toggleMenu('audioMenu'); });
$('subsBtn').addEventListener('click', e => { e.stopPropagation(); toggleMenu('subsMenu'); });
$('volumeSlider').addEventListener('input', e => { setVolume(parseInt(e.target.value)); scheduleHideUI(); });
$('volumeIcon').addEventListener('click', () => { setVolume(0); scheduleHideUI(); });
$('playerContainer').addEventListener('mousemove', scheduleHideUI);
$('playerContainer').addEventListener('touchstart', scheduleHideUI, { passive: true });

document.addEventListener('keydown', e => {
  if (!$('playerOverlay').classList.contains('active')) {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('searchInput').focus(); }
    return;
  }
  switch (e.key) {
    case ' ': case 'k': e.preventDefault(); togglePlay(); scheduleHideUI(); break;
    case 'f': case 'F': toggleFullscreen(); break;
    case 'm': case 'M': toggleMute(); break;
    case 'Escape': if (!document.fullscreenElement) closePlayer(); break;
    case 'ArrowRight': video.currentTime += 10; scheduleHideUI(); break;
    case 'ArrowLeft': video.currentTime -= 10; scheduleHideUI(); break;
    case 'ArrowUp': e.preventDefault(); setVolume(parseInt($('volumeSlider').value) + 10); scheduleHideUI(); break;
    case 'ArrowDown': e.preventDefault(); setVolume(parseInt($('volumeSlider').value) - 10); scheduleHideUI(); break;
  }
});

$('searchInput').addEventListener('input', debounce(e => performSearch(e.target.value), 250));
$('modalOverlay').addEventListener('click', e => { if (e.target === $('modalOverlay')) closeModal(); });
window.addEventListener('scroll', () => $('navbar').classList.toggle('scrolled', window.scrollY > 50));
document.addEventListener('click', e => {
  if (!e.target.closest('.ctrl-menu') && !e.target.closest('.ctrl-btn')) hideMenus();
});

/* ═══════════════════════════════════════════════════════════
   INICIALIZACIÓN
   ═══════════════════════════════════════════════════════════ */

async function init() {
  updateFavBadge();
  setVolume(100);
  await loadAllSources();
  if (!state.allContent.length) {
    $('mainContent').innerHTML = `<div class="no-results" style="padding:100px 24px"><div class="no-results-icon">📡</div><p>Error de conexión.</p></div>`;
    return;
  }
  renderHome();
  pickHeroItems();
  renderHero();
  restartHeroTimer();
}

init();
</script>
